name: Verify service
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/playwright
      - run: npm run verify:local
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: npm run verify:service
        env:
          PG_DUMP_BIN: /usr/lib/postgresql/16/bin/pg_dump
          PG_RESTORE_BIN: /usr/lib/postgresql/16/bin/pg_restore
      - name: Validate production compose configuration
        run: docker compose -f infra/compose.production.yml config --quiet
        env:
          PASSPORT_DOMAIN: passport.example.invalid
          DATABASE_PASSWORD: ci-validation-only
          MEMORY_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
